name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RustCraftLauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core for Android
        working-directory: RustCraftLauncher/rust-core
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rustcraft-debug-apk
          path: RustCraftLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
